а<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Конструктор урока</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;">
<div id="root"></div>

<script type="text/babel" data-presets='[["react", { "runtime": "classic" }]]'>
const { useState, useRef, useEffect } = React;


/* ---------- design tokens (CSS variables so dark theme just swaps them) ---------- */
const INK = "var(--ink)";
const INK_SOFT = "var(--ink-soft)";
const MUTE = "var(--mute)";
const PAPER = "var(--paper)";
const CARD = "var(--card)";
const LINE = "var(--line)";
const GOLD = "var(--gold)";
const GOLD_SOFT = "var(--gold-soft)";
const SAGE = "var(--sage)";
const SAGE_SOFT = "var(--sage-soft)";
const RUST = "var(--rust)";
const RUST_SOFT = "var(--rust-soft)";
const INK_DEEP = "var(--ink-deep)";
const BTN_TEXT = "var(--btn-text)";

const STANDARDS = [
  { key: "none", label: "Без привязки" },
  { key: "fgos", label: "ФГОС" },
  { key: "cambridge", label: "Cambridge" },
  { key: "ib", label: "IB" },
];

const QUESTION_TYPE_OPTIONS = [
  { key: "single", label: "Выбор варианта" },
  { key: "open", label: "Открытый ответ" },
  { key: "match", label: "Соответствие" },
];

const SERIF = "'Fraunces', Georgia, serif";
const SANS = "'Inter', -apple-system, 'Segoe UI', sans-serif";

const THEME_CSS = `
  [data-app-theme="light"] {
    --ink:#161B2E; --ink-soft:#454E6B; --mute:#8B8578; --paper:#F8F6F0; --card:#FFFFFF;
    --line:#E4DFD1; --gold:#B8873A; --gold-soft:#F4E9D5; --sage:#5C7A5E; --sage-soft:#E9F0E7;
    --rust:#AD4F35; --rust-soft:#F6E7E1; --ink-deep:#0E1120; --btn-text:#FFFFFF; --btn-disabled:#DAD4C6;
  }
  [data-app-theme="dark"] {
    --ink:#EDEAE0; --ink-soft:#C7C2B4; --mute:#9A9384; --paper:#161826; --card:#20222F;
    --line:#3A3D4D; --gold:#D9A85C; --gold-soft:#3A2F18; --sage:#8FBF92; --sage-soft:#1E2E20;
    --rust:#E08064; --rust-soft:#3A231D; --ink-deep:#D9A85C; --btn-text:#1A1300; --btn-disabled:#3A3D4D;
  }
`;

const MATERIAL_TYPES = [
  { key: "plan", label: "План урока", icon: "plan" },
  { key: "script", label: "Сценарий урока (текст для учителя)", icon: "mic" },
  { key: "quiz", label: "Тест", icon: "quiz" },
  { key: "flashcards", label: "Карточки", icon: "cards" },
  { key: "handout", label: "Раздаточный текст", icon: "handout" },
  { key: "homework", label: "Домашнее задание", icon: "home" },
  { key: "discussion", label: "Вопросы для обсуждения", icon: "chat" },
];

const SUBJECT_PRESETS = ["Математика","Физика","История","Биология","Информатика","Русский язык","Английский язык","Немецкий язык","Французский язык","Испанский язык","Китайский язык","Химия","Обществознание","География","Литература","Астрономия","Экономика","ОБЖ","Физкультура","Музыка","ИЗО"];
const DIFFICULTIES = [
  { key: "base", label: "Базовый" },
  { key: "adv", label: "Повышенный" },
  { key: "olymp", label: "Олимпиадный" },
];

function Icon({ name, size = 15, color = "currentColor" }) {
  const p = { width: size, height: size, viewBox: "0 0 16 16", fill: "none" };
  switch (name) {
    case "plan": return <svg {...p}><path d="M2 3h12M2 7h8M2 11h10" stroke={color} strokeWidth="1.4" strokeLinecap="round"/></svg>;
    case "quiz": return <svg {...p}><path d="M3 3h10v10H3z" stroke={color} strokeWidth="1.4"/><path d="M5.5 8l1.8 1.8L11 6.2" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    case "cards": return <svg {...p}><rect x="2.5" y="4" width="8" height="9" rx="1.2" stroke={color} strokeWidth="1.4"/><path d="M6.5 4V2.8a1 1 0 0 1 1-1H13a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1.5" stroke={color} strokeWidth="1.4"/></svg>;
    case "handout": return <svg {...p}><path d="M4 2h6l3 3v9H4z" stroke={color} strokeWidth="1.4" strokeLinejoin="round"/><path d="M6 8h5M6 10.5h5M6 5.5h1.5" stroke={color} strokeWidth="1.2" strokeLinecap="round"/></svg>;
    case "home": return <svg {...p}><path d="M2.5 7.5L8 3l5.5 4.5" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/><path d="M4 7v6h8V7" stroke={color} strokeWidth="1.4"/></svg>;
    case "chat": return <svg {...p}><path d="M2.5 3.5h11v7h-7L3.5 13V10.5h-1z" stroke={color} strokeWidth="1.4" strokeLinejoin="round"/></svg>;
    case "mic": return <svg {...p}><rect x="6" y="2" width="4" height="7" rx="2" stroke={color} strokeWidth="1.4"/><path d="M4 7.5a4 4 0 0 0 8 0M8 11.5V14M5.5 14h5" stroke={color} strokeWidth="1.4" strokeLinecap="round"/></svg>;
    case "script": return <svg {...p}><path d="M4 2.5h6.5L13 5v8.5H4z" stroke={color} strokeWidth="1.4" strokeLinejoin="round"/><path d="M6 6.5h5M6 8.7h5M6 10.9h3.2" stroke={color} strokeWidth="1.2" strokeLinecap="round"/></svg>;
    case "download": return <svg {...p}><path d="M8 2v7.5M8 9.5L5 6.6M8 9.5l3-2.9M3 12.5h10" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    case "sparkle": return <svg {...p}><path d="M8 1.5l1.3 3.7L13 6.5l-3.7 1.3L8 11.5l-1.3-3.7L3 6.5l3.7-1.3L8 1.5z" fill={color}/></svg>;
    case "refresh": return <svg {...p}><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2v3h-3" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    case "trash": return <svg {...p}><path d="M3 4.5h10M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5 4.5V13a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V4.5" stroke={color} strokeWidth="1.3" strokeLinecap="round"/></svg>;
    case "print": return <svg {...p}><path d="M4 6V2h8v4M4 11h8v3H4zM2.5 6h11a1 1 0 0 1 1 1v4h-2.5M2.5 11H1.5v-4a1 1 0 0 1 1-1" stroke={color} strokeWidth="1.3" strokeLinejoin="round"/></svg>;
    default: return null;
  }
}

function extractJson(text) {
  const cleaned = text.replace(/```json|```/g, "").trim();
  const start = cleaned.indexOf("{");
  const end = cleaned.lastIndexOf("}");
  return JSON.parse(cleaned.slice(start, end + 1));
}

async function callClaude(prompt, maxTokens, model) {
  const response = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, maxTokens, model }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(`HTTP ${response.status}: ${JSON.stringify(data.error || data)}`);
  return extractJson(data.text || "");
}

function maxTokensFor(key, counts) {
  if (key === "quiz") return Math.min(8000, 800 + counts.quiz * counts.variants * 180);
  if (key === "flashcards") return Math.min(6000, 400 + counts.flashcards * 120);
  if (key === "script") return 4000;
  return 2500;
}

function modelFor(key) {
  // тест и сценарий важны для точности — берём модель качества; остальное — самую быструю
  return (key === "quiz" || key === "script") ? "quality" : "fast";
}

function schemaFor(key, counts) {
  switch (key) {
    case "plan": return `"plan": {"goal": string, "stages": [{"name": string, "minutes": number, "description": string (развёрнуто, 3-5 предложений: что именно делает учитель и что делают ученики на этом этапе)}]}`;
    case "script": return `"script": {"sections": [{"stageName": string, "narration": string (буквальный текст того, что учитель говорит классу на этом этапе — живая речь, не тезисы; если этап вводит новый термин, дай его чёткое определение прямо внутри текста и приведи простой пример; объём — от 120 до 250 слов на этап)}]}`;
    case "quiz": return `"quiz": [ // массив вариантов теста, ровно ${counts.variants} штук
      [ // вопросы одного варианта, ровно ${counts.quiz} штук, разрешённые типы вопроса: ${counts.types.join(", ")}
        {
          "type": "single | open | match",
          "question": string,
          "options": [string,string,string,string] (только если type=single),
          "correctIndex": number (только если type=single),
          "answer": string (только если type=open — эталонный развёрнутый ответ),
          "pairs": [{"term": string, "definition": string}] (только если type=match, 4-6 пар),
          "explanation": string (2-3 предложения: почему этот ответ верный, с чем часто путают)
        }
      ]
    ] (если вариантов больше одного — вопросы между вариантами должны как можно меньше повторяться, использовать разные формулировки и примеры на ту же тему)`;
    case "flashcards": return `"flashcards": [{"term": string, "definition": string (развёрнутое определение, 2 предложения), "example": string (короткий пример использования/применения термина)}] (ровно ${counts.flashcards} штук)`;
    case "handout": return `"handout": {"title": string, "body": string (связный, подробный текст на 350-500 слов, разбитый на 2-3 смысловых абзаца)}`;
    case "homework": return `"homework": {"tasks": [{"task": string, "hint": string (короткая подсказка или на что обратить внимание)}]} (4-6 заданий)`;
    case "discussion": return `"discussion": {"questions": [string]} (5-7 открытых вопросов для обсуждения в классе, провоцирующих рассуждение, а не короткий ответ)`;
    default: return "";
  }
}

/* ---------- small UI atoms ---------- */
function Field({ label, children, hint }) {
  return (
    <label style={{ display: "block", marginBottom: 16 }}>
      <span style={{ display: "flex", justifyContent: "space-between", fontFamily: SANS, fontSize: 12, fontWeight: 600, color: INK_SOFT, marginBottom: 6 }}>
        {label} {hint && <span style={{ color: MUTE, fontWeight: 400 }}>{hint}</span>}
      </span>
      {children}
    </label>
  );
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "10px 12px",
  fontFamily: SANS, fontSize: 14, color: INK, background: CARD,
  border: `1px solid ${LINE}`, borderRadius: 8, outline: "none",
};

function Chip({ active, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      padding: "6px 13px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
      border: `1px solid ${active ? INK : LINE}`, background: active ? INK : "transparent",
      color: active ? BTN_TEXT : INK_SOFT, fontFamily: SANS, transition: "all .15s",
    }}>
      {children}
    </button>
  );
}

function MaterialToggle({ checked, onChange, label, icon }) {
  return (
    <button type="button" onClick={onChange} style={{
      display: "flex", alignItems: "center", gap: 9, padding: "9px 12px",
      border: `1px solid ${checked ? GOLD : LINE}`, borderRadius: 8,
      background: checked ? GOLD_SOFT : CARD, cursor: "pointer", fontFamily: SANS,
    }}>
      <span style={{
        width: 26, height: 26, borderRadius: 6, flexShrink: 0,
        background: checked ? GOLD : PAPER, color: checked ? BTN_TEXT : MUTE,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <Icon name={icon} size={13} />
      </span>
      <span style={{ fontSize: 13, fontWeight: 600, color: INK, textAlign: "left" }}>{label}</span>
    </button>
  );
}

/* ---------- main app ---------- */
function LessonGenerator() {
  const [topic, setTopic] = useState("");
  const [subject, setSubject] = useState("Математика");
  const [grade, setGrade] = useState("8 класс");
  const [duration, setDuration] = useState("45");
  const [difficulty, setDifficulty] = useState("base");
  const [selected, setSelected] = useState({ plan: true, quiz: true, flashcards: false, handout: false, homework: false, discussion: false });
  const [quizCount, setQuizCount] = useState(20);
  const [flashcardCount, setFlashcardCount] = useState(10);
  const [theme, setTheme] = useState("light");
  const [standard, setStandard] = useState("none");
  const [questionTypes, setQuestionTypes] = useState(["single"]);
  const [variantsCount, setVariantsCount] = useState(1);
  const [status, setStatus] = useState("idle");
  const [loadingLabel, setLoadingLabel] = useState("");
  const [errorMsg, setErrorMsg] = useState("");
  const [result, setResult] = useState(null);
  const [activeTab, setActiveTab] = useState("plan");
  const [library, setLibrary] = useState(() => {
    try {
      const raw = localStorage.getItem("lesson-library");
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  });
  const [regeneratingKey, setRegeneratingKey] = useState(null);
  const [activeVariant, setActiveVariant] = useState(0);
  const printRef = useRef(null);

  const toggle = (key) => setSelected((s) => ({ ...s, [key]: !s[key] }));
  const anySelected = Object.values(selected).some(Boolean);

  const diffLabel = { base: "базовом", adv: "повышенном", olymp: "олимпиадном" }[difficulty];
  const standardLabel = STANDARDS.find((s) => s.key === standard)?.label;

  function buildPrompt(wanted) {
    return `Ты — опытный методист и учитель, который готовит материалы к уроку.
Предмет: ${subject}
Класс: ${grade}
Тема урока: ${topic}
Длительность урока: ${duration} минут
Уровень сложности: ${diffLabel}
${standard !== "none" ? `Образовательный стандарт/программа: ${standardLabel} — используй терминологию и акценты, характерные для этой программы.` : ""}

Составь материалы и верни ТОЛЬКО валидный JSON без markdown и пояснений, со следующими ключами:
{
${wanted.map((k) => schemaFor(k, { quiz: quizCount, flashcards: flashcardCount, variants: variantsCount, types: questionTypes })).join(",\n")}
}
Язык — русский. Пиши развёрнуто и содержательно, не ограничивайся общими фразами — учитель должен получить готовый к использованию материал, а не набросок. Объясняй термины простыми словами, как будто говоришь с классом. Материалы должны точно соответствовать заявленному уровню сложности и возрасту класса.
Никакого текста вне JSON.`;
  }

  async function generate() {
    if (!topic.trim() || !anySelected) return;
    setStatus("loading");
    setErrorMsg("");
    const wanted = MATERIAL_TYPES.filter((m) => selected[m.key]).map((m) => m.key);

    const data = {};
    const failedKeys = [];
    let done = 0;
    setLoadingLabel(`Генерирую 0 из ${wanted.length}…`);

    const BATCH_SIZE = 4;
    for (let i = 0; i < wanted.length; i += BATCH_SIZE) {
      const batch = wanted.slice(i, i + BATCH_SIZE);
      await Promise.all(
        batch.map(async (key) => {
          let lastError = null;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const counts = { quiz: quizCount, flashcards: flashcardCount, variants: variantsCount };
              const parsed = await callClaude(buildPrompt([key]), maxTokensFor(key, counts), modelFor(key));
              data[key] = parsed[key];
              lastError = null;
              break;
            } catch (e) {
              lastError = e;
              const isRateLimit = /429|rate.?limit/i.test(String(e.message || e));
              if (isRateLimit && attempt < 2) {
                await new Promise((r) => setTimeout(r, 2500 * (attempt + 1)));
                continue;
              }
              break;
            }
          }
          if (lastError) failedKeys.push(key);
          done += 1;
          setLoadingLabel(`Готово ${done} из ${wanted.length}…`);
        })
      );
    }

    if (Object.keys(data).length === 0) {
      setErrorMsg("Не удалось сгенерировать материалы. Причина: " + (failedKeys.length ? "перегружен ИИ-сервис или превышен лимит запросов, подожди минуту и попробуй снова." : "проверь тему и попробуй ещё раз."));
      setStatus("error");
      return;
    }

    const successfulKeys = wanted.filter((k) => data[k]);
    const entry = { id: Date.now(), topic, subject, grade, duration, difficulty, wanted: successfulKeys, data };
    setResult(entry);
    setActiveTab(successfulKeys[0]);
    setActiveVariant(0);
    setLibrary((h) => {
      const next = [entry, ...h].slice(0, 20);
      try { localStorage.setItem("lesson-library", JSON.stringify(next)); } catch (e) {}
      return next;
    });
    setStatus("done");
    if (failedKeys.length > 0) {
      const names = failedKeys.map((k) => MATERIAL_TYPES.find((m) => m.key === k)?.label || k).join(", ");
      setErrorMsg(`Не получилось сгенерировать: ${names}. Скорее всего сработал лимит бесплатного ИИ — подожди немного и перегенерируй эти разделы кнопкой «Перегенерировать» во вкладке.`);
    }
  }

  async function regenerateSection(key) {
    if (!result) return;
    setRegeneratingKey(key);
    try {
      const counts = { quiz: quizCount, flashcards: flashcardCount, variants: variantsCount };
      const parsed = await callClaude(buildPrompt([key]), maxTokensFor(key, counts), modelFor(key));
      setResult((r) => ({ ...r, data: { ...r.data, [key]: parsed[key] } }));
    } catch (e) {
      setErrorMsg("Не получилось обновить раздел. Попробуй ещё раз.");
    } finally {
      setRegeneratingKey(null);
    }
  }

  function updateQuizOption(vIdx, qIdx, optIdx, value) {
    setResult((r) => {
      const quiz = r.data.quiz.map((variant, vi) => {
        if (vi !== vIdx) return variant;
        return variant.map((q, qi) => {
          if (qi !== qIdx) return q;
          const options = [...q.options];
          options[optIdx] = value;
          return { ...q, options };
        });
      });
      return { ...r, data: { ...r.data, quiz } };
    });
  }

  function updateQuizField(vIdx, qIdx, field, value) {
    setResult((r) => {
      const quiz = r.data.quiz.map((variant, vi) => {
        if (vi !== vIdx) return variant;
        return variant.map((q, qi) => (qi === qIdx ? { ...q, [field]: value } : q));
      });
      return { ...r, data: { ...r.data, quiz } };
    });
  }

  function updateMatchPair(vIdx, qIdx, pairIdx, field, value) {
    setResult((r) => {
      const quiz = r.data.quiz.map((variant, vi) => {
        if (vi !== vIdx) return variant;
        return variant.map((q, qi) => {
          if (qi !== qIdx) return q;
          const pairs = q.pairs.map((p, pi) => (pi === pairIdx ? { ...p, [field]: value } : p));
          return { ...q, pairs };
        });
      });
      return { ...r, data: { ...r.data, quiz } };
    });
  }

  function updatePlanStage(i, field, value) {
    setResult((r) => {
      const stages = r.data.plan.stages.map((s, si) => (si === i ? { ...s, [field]: value } : s));
      return { ...r, data: { ...r.data, plan: { ...r.data.plan, stages } } };
    });
  }

  function updatePlanGoal(value) {
    setResult((r) => ({ ...r, data: { ...r.data, plan: { ...r.data.plan, goal: value } } }));
  }

  function updateScriptSection(i, value) {
    setResult((r) => {
      const sections = r.data.script.sections.map((s, si) => (si === i ? { ...s, narration: value } : s));
      return { ...r, data: { ...r.data, script: { ...r.data.script, sections } } };
    });
  }

  function updateFlashcard(i, field, value) {
    setResult((r) => {
      const flashcards = r.data.flashcards.map((c, ci) => (ci === i ? { ...c, [field]: value } : c));
      return { ...r, data: { ...r.data, flashcards } };
    });
  }

  function updateHandout(field, value) {
    setResult((r) => ({ ...r, data: { ...r.data, handout: { ...r.data.handout, [field]: value } } }));
  }

  function updateHomeworkTask(i, field, value) {
    setResult((r) => {
      const tasks = r.data.homework.tasks.map((t, ti) => {
        if (ti !== i) return t;
        const obj = typeof t === "string" ? { task: t, hint: "" } : t;
        return { ...obj, [field]: value };
      });
      return { ...r, data: { ...r.data, homework: { ...r.data.homework, tasks } } };
    });
  }

  function updateDiscussionQuestion(i, value) {
    setResult((r) => {
      const questions = r.data.discussion.questions.map((q, qi) => (qi === i ? value : q));
      return { ...r, data: { ...r.data, discussion: { ...r.data.discussion, questions } } };
    });
  }

  function downloadPptx() {
    if (!result || !result.data.plan) return;
    if (typeof window.JSZip === "undefined") {
      setErrorMsg("Экспорт в PowerPoint работает только на развёрнутом сайте (нужна библиотека JSZip, которой нет в этом окне предпросмотра).");
      return;
    }
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const slideXml = (title, body) => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">

<p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">

<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${slides.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${i + 1}.xml"/>`).join("\n")}
<Relationship Id="rIdMaster" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>
</Relationships>`);
    zip.file("ppt/theme/theme1.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<a:theme xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" name="Theme">
<a:themeElements><a:clrScheme name="Office"><a:dk1><a:sysClr val="windowText" lastClr="000000"/></a:dk1><a:lt1><a:sysClr val="window" lastClr="FFFFFF"/></a:lt1><a:dk2><a:srgbClr val="1F2A44"/></a:dk2><a:lt2><a:srgbClr val="EEECE1"/></a:lt2><a:accent1><a:srgbClr val="B8873A"/></a:accent1><a:accent2><a:srgbClr val="4F81BD"/></a:accent2><a:accent3><a:srgbClr val="9BBB59"/></a:accent3><a:accent4><a:srgbClr val="8064A2"/></a:accent4><a:accent5><a:srgbClr val="4BACC6"/></a:accent5><a:accent6><a:srgbClr val="F79646"/></a:accent6><a:hlink><a:srgbClr val="0000FF"/></a:hlink><a:folHlink><a:srgbClr val="800080"/></a:folHlink></a:clrScheme>
<a:fontScheme name="Office"><a:majorFont><a:latin typeface="Calibri"/></a:majorFont><a:minorFont><a:latin typeface="Calibri"/></a:minorFont></a:fontScheme>
<a:fmtScheme name="Office"><a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:fillStyleLst><a:lnStyleLst><a:ln><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln></a:lnStyleLst><a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst><a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:bgFillStyleLst></a:fmtScheme>
</a:themeElements></a:theme>`);
    zip.file("ppt/slideMasters/slideMaster1.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:sldMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
<p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/></p:spTree></p:cSld>
<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/>
<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst>
</p:sldMaster>`);
    zip.file("ppt/slideMasters/_rels/slideMaster1.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/>

    zip.file("ppt/slideLayouts/slideLayout1.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:sldLayout xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" type="blank">

    zip.file("ppt/slideLayouts/_rels/slideLayout1.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

      const a = document.createElement("a");
      a.href = url;
      a.download = `урок-${result.subject}-${result.topic}.pptx`.replace(/\s+/g, "_");

  }

  function downloadWord() {
    if (!result) return;
    const d = result.data;
    let html = `<html><head><meta charset="utf-8"><style>
      body{font-family:Calibri,Arial,sans-serif;} h1{font-size:20pt;} h2{font-size:15pt;margin-top:24pt;border-bottom:1px solid #ccc;}
      .q{margin-bottom:10pt;} .opt{margin-left:14pt;} .correct{font-weight:bold;color:#2e7d32;} .hint{color:#777;font-style:italic;}
    </style></head><body>`;
    html += `<h1>${result.subject} · ${result.grade} · ${result.topic}</h1>`;
    if (d.plan) {
      html += `<h2>План урока</h2><p><b>Цель:</b> ${d.plan.goal}</p>`;
      d.plan.stages.forEach((s, i) => (html += `<p><b>${i + 1}. ${s.name}</b> (${s.minutes} мин)<br>${s.description}</p>`));
    }
    if (d.script) {
      html += `<h2>Сценарий урока</h2>`;
      d.script.sections.forEach((s) => (html += `<p><b>${s.stageName}</b><br>${s.narration}</p>`));
    }
    if (d.quiz) {
      d.quiz.forEach((variant, vi) => {
        html += `<h2>Тест${d.quiz.length > 1 ? ` — Вариант ${vi + 1}` : ""}</h2>`;
        variant.forEach((q, i) => {
          html += `<div class="q"><b>${i + 1}. ${q.question}</b><br>`;
          if (q.type === "single" && q.options) {
            q.options.forEach((o, j) => (html += `<span class="opt ${j === q.correctIndex ? "correct" : ""}">${String.fromCharCode(97 + j)}) ${o}</span><br>`));
          } else if (q.type === "open") {
            html += `<span class="opt"><i>Эталонный ответ: ${q.answer || ""}</i></span><br>`;
          } else if (q.type === "match" && q.pairs) {
            q.pairs.forEach((p) => (html += `<span class="opt">${p.term} — ${p.definition}</span><br>`));
          }
          if (q.explanation) html += `<span class="hint">${q.explanation}</span>`;
          html += `</div>`;
        });
      });
    }
    if (d.flashcards) {
      html += `<h2>Карточки</h2>`;
      d.flashcards.forEach((c) => (html += `<p><b>${c.term}</b> — ${c.definition}${c.example ? `<br><i>Пример: ${c.example}</i>` : ""}</p>`));
    }
    if (d.handout) html += `<h2>Раздаточный материал: ${d.handout.title}</h2><p>${d.handout.body.replace(/\n/g, "<br>")}</p>`;
    if (d.homework) {
      html += `<h2>Домашнее задание</h2>`;
      d.homework.tasks.forEach((t, i) => {
        const task = typeof t === "string" ? t : t.task;
        const hint = typeof t === "string" ? "" : t.hint;
        html += `<p>${i + 1}. ${task}${hint ? `<br><span class="hint">Подсказка: ${hint}</span>` : ""}</p>`;
      });
    }
    if (d.discussion) {
      html += `<h2>Вопросы для обсуждения</h2>`;
      d.discussion.questions.forEach((q, i) => (html += `<p>${i + 1}. ${q}</p>`));
    }
    html += `</body></html>`;

    const blob = new Blob(["\ufeff", html], { type: "application/msword" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `урок-${result.subject}-${result.topic}.doc`.replace(/\s+/g, "_");
    a.click();
    URL.revokeObjectURL(url);
  }

  function downloadText() {
    if (!result) return;
    let out = `${result.subject} · ${result.grade} · ${result.topic}\n${"=".repeat(44)}\n\n`;
    const d = result.data;
    if (d.plan) {
      out += `ПЛАН УРОКА\nЦель: ${d.plan.goal}\n\n`;
      d.plan.stages.forEach((s, i) => (out += `${i + 1}. ${s.name} (${s.minutes} мин)\n   ${s.description}\n`));
      out += "\n";
    }
    if (d.script) {
      out += `СЦЕНАРИЙ УРОКА (текст для учителя)\n\n`;
      d.script.sections.forEach((s) => (out += `--- ${s.stageName} ---\n${s.narration}\n\n`));
    }
    if (d.quiz) {
      d.quiz.forEach((variant, vi) => {
        out += `ТЕСТ${d.quiz.length > 1 ? ` — ВАРИАНТ ${vi + 1}` : ""}\n\n`;
        variant.forEach((q, i) => {
          out += `${i + 1}. ${q.question}\n`;
          if (q.type === "single" && q.options) {
            q.options.forEach((o, j) => (out += `   ${String.fromCharCode(97 + j)}) ${o}${j === q.correctIndex ? "  ✓" : ""}\n`));
          } else if (q.type === "open") {
            out += `   Эталонный ответ: ${q.answer || ""}\n`;
          } else if (q.type === "match" && q.pairs) {
            q.pairs.forEach((p) => (out += `   ${p.term} — ${p.definition}\n`));
          }
          if (q.explanation) out += `   Пояснение: ${q.explanation}\n`;
          out += "\n";
        });
      });
    }
    if (d.flashcards) {
      out += `КАРТОЧКИ\n\n`;
      d.flashcards.forEach((c) => (out += `${c.term} — ${c.definition}${c.example ? `\n   Пример: ${c.example}` : ""}\n`));
      out += "\n";
    }
    if (d.handout) out += `РАЗДАТОЧНЫЙ МАТЕРИАЛ: ${d.handout.title}\n\n${d.handout.body}\n\n`;
    if (d.homework) {
      out += `ДОМАШНЕЕ ЗАДАНИЕ\n\n`;
      d.homework.tasks.forEach((t, i) => {
        const task = typeof t === "string" ? t : t.task;
        const hint = typeof t === "string" ? "" : t.hint;
        out += `${i + 1}. ${task}${hint ? `\n   Подсказка: ${hint}` : ""}\n`;
      });
      out += "\n";
    }
    if (d.discussion) { out += `ВОПРОСЫ ДЛЯ ОБСУЖДЕНИЯ\n\n`; d.discussion.questions.forEach((q, i) => (out += `${i + 1}. ${q}\n`)); }

    const blob = new Blob([out], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `урок-${result.subject}-${result.topic}.txt`.replace(/\s+/g, "_"); a.click();
    URL.revokeObjectURL(url);
  }

  function printLesson() {
    window.print();
  }

  const tabsAvailable = result ? MATERIAL_TYPES.filter((m) => result.wanted.includes(m.key)) : [];

  return (
    <div data-app-theme={theme} style={{ background: PAPER, minHeight: "100%", fontFamily: SANS, color: INK }}>
      <style>{THEME_CSS}</style>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        ::placeholder { color: #B9B2A0; }
        button { font-family: inherit; transition: opacity .15s, transform .1s; }
        button:active { transform: scale(0.98); }
        select { appearance: none; }
        @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
        @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise { animation: rise .35s ease both; }
        @media print {
          body * { visibility: hidden; }
          #print-area, #print-area * { visibility: visible; }
          #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
        }
        @media (max-width: 760px) {
          .app-grid { grid-template-columns: 1fr !important; }
          .app-header h1 { font-size: 26px !important; }
        }
      `}</style>

      <div style={{ maxWidth: 1040, margin: "0 auto", padding: "44px 24px 72px" }}>
        <header className="app-header" style={{ marginBottom: 32, display: "flex", justifyContent: "space-between", alignItems: "flex-end", borderBottom: `1px solid ${LINE}`, paddingBottom: 22 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <div style={{ width: 24, height: 24, borderRadius: 6, background: INK_DEEP, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name="sparkle" size={12} color={GOLD} />
              </div>
              <span style={{ fontSize: 12.5, fontWeight: 700, letterSpacing: "0.03em", color: INK_SOFT }}>КОНСТРУКТОР УРОКА</span>
            </div>
            <h1 style={{ fontFamily: SERIF, fontSize: 32, fontWeight: 600, margin: 0, lineHeight: 1.12 }}>
              Материалы к уроку, готовые для класса
            </h1>
          </div>
          <button onClick={() => setTheme((t) => (t === "light" ? "dark" : "light"))} style={{
            display: "flex", alignItems: "center", gap: 6, background: "none", border: `1px solid ${LINE}`,
            borderRadius: 20, padding: "7px 12px", fontSize: 12, fontWeight: 600, color: INK_SOFT, cursor: "pointer",
          }}>
            {theme === "light" ? "🌙 Тёмная" : "☀️ Светлая"}
          </button>
        </header>

        <div className="app-grid" style={{ display: "grid", gridTemplateColumns: "360px 1fr", gap: 26 }}>
          {/* -------- form -------- */}
          <div style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: 22, height: "fit-content" }}>
            <Field label="Тема урока">
              <input style={inputStyle} value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Например: Квадратные уравнения" />
            </Field>

            <Field label="Предмет" hint="можно ввести свой">
              <input
                style={inputStyle}
                list="subject-suggestions"
                value={subject}
                onChange={(e) => setSubject(e.target.value)}
                placeholder="Например: Немецкий язык"
              />
              <datalist id="subject-suggestions">
                {SUBJECT_PRESETS.map((s) => <option key={s} value={s} />)}
              </datalist>
            </Field>

            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <Field label="Класс"><input style={inputStyle} value={grade} onChange={(e) => setGrade(e.target.value)} /></Field>
              </div>
              <div style={{ width: 96 }}>
                <Field label="Мин."><input style={inputStyle} type="number" value={duration} onChange={(e) => setDuration(e.target.value)} /></Field>
              </div>
            </div>

            <Field label="Уровень сложности">
              <div style={{ display: "flex", gap: 7 }}>
                {DIFFICULTIES.map((d) => (
                  <Chip key={d.key} active={difficulty === d.key} onClick={() => setDifficulty(d.key)}>{d.label}</Chip>
                ))}
              </div>
            </Field>

            <Field label="Образовательный стандарт">
              <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
                {STANDARDS.map((s) => (
                  <Chip key={s.key} active={standard === s.key} onClick={() => setStandard(s.key)}>{s.label}</Chip>
                ))}
              </div>
            </Field>

            <div style={{ marginTop: 6, marginBottom: 4 }}>
              <span style={{ display: "block", fontSize: 12, fontWeight: 600, color: INK_SOFT, marginBottom: 8 }}>Что сгенерировать</span>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 }}>
                {MATERIAL_TYPES.map((m) => (
                  <MaterialToggle key={m.key} checked={selected[m.key]} onChange={() => toggle(m.key)} label={m.label} icon={m.icon} />
                ))}
              </div>
              {selected.quiz && (
                <div style={{ marginTop: 10, padding: 10, background: PAPER, borderRadius: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                    <span style={{ fontSize: 12.5, color: INK_SOFT }}>Вопросов в тесте:</span>
                    <input type="number" min="1" max="50" value={quizCount} onChange={(e) => setQuizCount(e.target.value === "" ? "" : Number(e.target.value))} onBlur={(e) => setQuizCount(Math.max(1, Number(e.target.value) || 1))} style={{ ...inputStyle, width: 64, padding: "5px 8px" }} />
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                    <span style={{ fontSize: 12.5, color: INK_SOFT }}>Вариантов теста:</span>
                    <input type="number" min="1" max="4" value={variantsCount} onChange={(e) => setVariantsCount(e.target.value === "" ? "" : Number(e.target.value))} onBlur={(e) => setVariantsCount(Math.max(1, Math.min(4, Number(e.target.value) || 1)))} style={{ ...inputStyle, width: 64, padding: "5px 8px" }} />
                  </div>
                  <div>
                    <span style={{ fontSize: 12.5, color: INK_SOFT, display: "block", marginBottom: 6 }}>Типы вопросов:</span>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {QUESTION_TYPE_OPTIONS.map((t) => (
                        <Chip key={t.key} active={questionTypes.includes(t.key)} onClick={() => setQuestionTypes((qt) => qt.includes(t.key) ? (qt.length > 1 ? qt.filter((k) => k !== t.key) : qt) : [...qt, t.key])}>
                          {t.label}
                        </Chip>
                      ))}
                    </div>
                  </div>
                </div>
              )}
              {selected.flashcards && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8 }}>
                  <span style={{ fontSize: 12.5, color: INK_SOFT }}>Карточек:</span>
                  <input type="number" min="1" max="50" value={flashcardCount} onChange={(e) => setFlashcardCount(e.target.value === "" ? "" : Number(e.target.value))} onBlur={(e) => setFlashcardCount(Math.max(1, Number(e.target.value) || 1))} style={{ ...inputStyle, width: 64, padding: "5px 8px" }} />
                </div>
              )}
            </div>

            <button onClick={generate} disabled={status === "loading" || !topic.trim() || !anySelected} style={{
              width: "100%", marginTop: 14, padding: "13px 16px", borderRadius: 8, border: "none",
              background: !topic.trim() || !anySelected ? "var(--btn-disabled)" : INK_DEEP, color: BTN_TEXT,
              fontSize: 14.5, fontWeight: 700, cursor: !topic.trim() || !anySelected ? "not-allowed" : "pointer",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            }}>
              <Icon name="sparkle" size={14} color={GOLD} />
              {status === "loading" ? "Генерирую…" : "Сгенерировать материалы"}
            </button>

            {status === "error" && <p style={{ color: RUST, fontSize: 12.5, marginTop: 10 }}>{errorMsg}</p>}

            {library.length > 0 && (
              <div style={{ marginTop: 24, borderTop: `1px solid ${LINE}`, paddingTop: 14 }}>
                <span style={{ fontSize: 11.5, fontWeight: 700, color: MUTE, letterSpacing: "0.02em" }}>БИБЛИОТЕКА УРОКОВ</span>
                <div style={{ marginTop: 8 }}>
                  {library.map((h) => (
                    <div key={h.id} style={{ display: "flex", alignItems: "center", gap: 6, borderBottom: `1px dashed ${LINE}` }}>
                      <button onClick={() => { setResult(h); setActiveTab(h.wanted[0]); setStatus("done"); }} style={{
                        flex: 1, textAlign: "left", background: "none", border: "none", padding: "9px 0", fontSize: 12.5, color: INK, cursor: "pointer",
                      }}>
                        {h.topic} <span style={{ color: MUTE }}>· {h.subject}</span>
                      </button>
                      <button onClick={() => setLibrary((l) => { const next = l.filter((x) => x.id !== h.id); try { localStorage.setItem("lesson-library", JSON.stringify(next)); } catch (e) {} return next; })} style={{ background: "none", border: "none", cursor: "pointer", color: MUTE, padding: 4 }}>
                        <Icon name="trash" size={12} />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* -------- output -------- */}
          <div>
            {status === "idle" && (
              <div style={{ minHeight: 360, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", border: `1px dashed ${LINE}`, borderRadius: 12, color: MUTE, fontSize: 13.5, textAlign: "center", padding: 40, gap: 10 }}>
                <Icon name="sparkle" size={20} color={GOLD} />
                Заполни форму слева и нажми «Сгенерировать» — результат появится здесь.
              </div>
            )}

            {status === "loading" && (
              <div style={{ minHeight: 360, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", border: `1px solid ${LINE}`, borderRadius: 12, background: CARD, gap: 14 }}>
                <div style={{ display: "flex", gap: 5 }}>
                  {[0,1,2].map((n) => <span key={n} style={{ width: 6, height: 6, borderRadius: "50%", background: GOLD, animation: `pulse 1.1s ${n * 0.2}s infinite` }} />)}
                </div>
                <span style={{ fontSize: 13, color: MUTE }}>{loadingLabel}</span>
              </div>
            )}

            {result && status === "done" && (
              <div className="rise" style={{ border: `1px solid ${LINE}`, borderRadius: 12, background: CARD, overflow: "hidden" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "13px 18px", borderBottom: `1px solid ${LINE}`, flexWrap: "wrap", gap: 8 }}>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {tabsAvailable.map((t) => (
                      <button key={t.key} onClick={() => setActiveTab(t.key)} style={{
                        display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 20, border: "none",
                        fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                        background: activeTab === t.key ? INK_DEEP : PAPER, color: activeTab === t.key ? BTN_TEXT : INK_SOFT,
                      }}>
                        <Icon name={t.icon} size={12} /> {t.label}
                      </button>
                    ))}
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={printLesson} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: `1px solid ${LINE}`, borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 600, color: INK_SOFT, cursor: "pointer" }}>
                      <Icon name="print" size={11} /> Печать
                    </button>
                    {result.data.plan && (
                      <button onClick={downloadPptx} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: `1px solid ${LINE}`, borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 600, color: INK_SOFT, cursor: "pointer" }}>
                        <Icon name="download" size={11} /> PPTX
                      </button>
                    )}
                    <button onClick={downloadWord} style={{ display: "flex", alignItems: "center", gap: 5, background: INK_DEEP, border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 600, color: BTN_TEXT, cursor: "pointer" }}>
                      <Icon name="download" size={11} color="var(--btn-text)" /> Word
                    </button>
                    <button onClick={downloadText} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: `1px solid ${LINE}`, borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 600, color: INK_SOFT, cursor: "pointer" }}>
                      <Icon name="download" size={11} /> .txt
                    </button>
                  </div>
                </div>

                <div id="print-area" style={{ padding: 24, maxHeight: 600, overflowY: "auto" }}>
                  <SectionHeader
                    title={tabsAvailable.find((t) => t.key === activeTab)?.label}
                    onRegenerate={() => regenerateSection(activeTab)}
                    loading={regeneratingKey === activeTab}
                  />

                  {activeTab === "plan" && result.data.plan && (
                    <div>
                      <div style={{ display: "flex", gap: 6, alignItems: "baseline", marginBottom: 4 }}>
                        <span style={{ fontFamily: SERIF, fontSize: 16, fontStyle: "italic", color: INK_SOFT }}>Цель:</span>
                        <input value={result.data.plan.goal} onChange={(e) => updatePlanGoal(e.target.value)} style={{
                          flex: 1, border: "none", background: "transparent", fontFamily: SERIF, fontSize: 16, fontStyle: "italic", color: INK_SOFT, outline: "none",
                        }} />
                      </div>
                      {result.data.plan.stages.map((s, i) => (
                        <div key={i} style={{ display: "flex", gap: 14, padding: "12px 0", borderTop: i ? `1px solid ${PAPER}` : "none" }}>
                          <div style={{ width: 54, flexShrink: 0, fontSize: 12, fontWeight: 700, color: GOLD }}>{s.minutes} мин</div>
                          <div style={{ flex: 1 }}>
                            <input value={s.name} onChange={(e) => updatePlanStage(i, "name", e.target.value)} style={{ width: "100%", border: "none", background: "transparent", fontWeight: 600, fontSize: 14, color: INK, outline: "none", fontFamily: SANS }} />
                            <textarea value={s.description} onChange={(e) => updatePlanStage(i, "description", e.target.value)} rows={3} style={{ width: "100%", border: "none", background: "transparent", fontSize: 13, color: MUTE, marginTop: 2, lineHeight: 1.5, outline: "none", fontFamily: SANS, resize: "vertical" }} />
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === "script" && result.data.script && (
                    <div>
                      {result.data.script.sections.map((s, i) => (
                        <div key={i} style={{ marginBottom: 20, paddingBottom: 18, borderBottom: i < result.data.script.sections.length - 1 ? `1px solid ${PAPER}` : "none" }}>
                          <div style={{ fontSize: 12, fontWeight: 700, color: GOLD, marginBottom: 6, letterSpacing: "0.02em" }}>{s.stageName?.toUpperCase()}</div>
                          <textarea value={s.narration} onChange={(e) => updateScriptSection(i, e.target.value)} rows={6} style={{
                            width: "100%", border: "none", background: "transparent", fontFamily: SERIF, fontSize: 14.5, lineHeight: 1.75, color: INK, outline: "none", resize: "vertical",
                          }} />
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === "quiz" && result.data.quiz && (
                    <div>
                      {result.data.quiz.length > 1 && (
                        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
                          {result.data.quiz.map((_, vi) => (
                            <button key={vi} onClick={() => setActiveVariant(vi)} style={{
                              padding: "5px 12px", borderRadius: 16, border: "none", fontSize: 12, fontWeight: 600, cursor: "pointer",
                              background: activeVariant === vi ? GOLD : PAPER, color: activeVariant === vi ? BTN_TEXT : INK_SOFT,
                            }}>
                              Вариант {vi + 1}
                            </button>
                          ))}
                        </div>
                      )}
                      {(result.data.quiz[activeVariant] || result.data.quiz[0]).map((q, i) => (
                        <div key={i} style={{ marginBottom: 18 }}>
                          <div style={{ display: "flex", gap: 8 }}>
                            <span style={{ fontWeight: 600, fontSize: 14, flexShrink: 0 }}>{i + 1}.</span>
                            <textarea value={q.question} onChange={(e) => updateQuizField(activeVariant, i, "question", e.target.value)} rows={2} style={{
                              flex: 1, border: "none", background: "transparent", fontWeight: 600, fontSize: 14, fontFamily: SANS, color: INK, outline: "none", resize: "vertical",
                            }} />
                          </div>

                          {q.type === "single" && q.options && (
                            <div style={{ marginTop: 5 }}>
                              {q.options.map((o, j) => (
                                <div key={j} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 10px", marginBottom: 4, borderRadius: 6, background: j === q.correctIndex ? SAGE_SOFT : PAPER }}>
                                  <span style={{ fontWeight: 700, fontSize: 11.5, color: j === q.correctIndex ? SAGE : MUTE }}>{String.fromCharCode(97 + j)})</span>
                                  <input value={o} onChange={(e) => updateQuizOption(activeVariant, i, j, e.target.value)} style={{
                                    flex: 1, border: "none", background: "transparent", fontSize: 13, color: j === q.correctIndex ? SAGE : INK, outline: "none", fontFamily: SANS,
                                  }} />
                                  {j === q.correctIndex && <span style={{ fontSize: 10.5, fontWeight: 700, color: SAGE }}>верно</span>}
                                </div>
                              ))}
                            </div>
                          )}

                          {q.type === "open" && (
                            <div style={{ marginTop: 5, padding: "8px 10px", background: PAPER, borderRadius: 6 }}>
                              <span style={{ fontSize: 11, fontWeight: 700, color: MUTE }}>ЭТАЛОННЫЙ ОТВЕТ</span>
                              <textarea value={q.answer || ""} onChange={(e) => updateQuizField(activeVariant, i, "answer", e.target.value)} rows={2} style={{
                                width: "100%", border: "none", background: "transparent", fontSize: 13, color: INK, outline: "none", fontFamily: SANS, resize: "vertical", marginTop: 4,
                              }} />
                            </div>
                          )}

                          {q.type === "match" && q.pairs && (
                            <div style={{ marginTop: 5, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                              {q.pairs.map((p, pi) => (
                                <React.Fragment key={pi}>
                                  <input value={p.term} onChange={(e) => updateMatchPair(activeVariant, i, pi, "term", e.target.value)} style={{ ...inputStyle, padding: "6px 8px", fontSize: 12.5 }} />
                                  <input value={p.definition} onChange={(e) => updateMatchPair(activeVariant, i, pi, "definition", e.target.value)} style={{ ...inputStyle, padding: "6px 8px", fontSize: 12.5 }} />
                                </React.Fragment>
                              ))}
                            </div>
                          )}

                          {q.explanation && (
                            <div style={{ fontSize: 12.5, color: MUTE, marginTop: 5, paddingLeft: 10, lineHeight: 1.5, fontStyle: "italic" }}>
                              {q.explanation}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === "flashcards" && result.data.flashcards && (
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
                      {result.data.flashcards.map((c, i) => (
                        <div key={i} style={{ border: `1px solid ${LINE}`, borderRadius: 8, padding: "11px 13px", background: PAPER }}>
                          <input value={c.term} onChange={(e) => updateFlashcard(i, "term", e.target.value)} style={{ width: "100%", border: "none", background: "transparent", fontWeight: 700, fontSize: 13, color: INK, outline: "none", fontFamily: SANS }} />
                          <textarea value={c.definition} onChange={(e) => updateFlashcard(i, "definition", e.target.value)} rows={2} style={{ width: "100%", border: "none", background: "transparent", fontSize: 12, color: MUTE, marginTop: 3, lineHeight: 1.45, outline: "none", fontFamily: SANS, resize: "vertical" }} />
                          {c.example !== undefined && <input value={c.example} onChange={(e) => updateFlashcard(i, "example", e.target.value)} style={{ width: "100%", border: "none", background: "transparent", fontSize: 11.5, color: GOLD, marginTop: 5, outline: "none", fontFamily: SANS }} placeholder="Пример" />}
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === "handout" && result.data.handout && (
                    <div>
                      <input value={result.data.handout.title} onChange={(e) => updateHandout("title", e.target.value)} style={{ width: "100%", border: "none", background: "transparent", fontFamily: SERIF, fontSize: 18, fontWeight: 600, color: INK, outline: "none" }} />
                      <textarea value={result.data.handout.body} onChange={(e) => updateHandout("body", e.target.value)} rows={10} style={{ width: "100%", border: "none", background: "transparent", fontSize: 14, lineHeight: 1.7, color: "#3A3527", outline: "none", fontFamily: SANS, resize: "vertical", marginTop: 8 }} />
                    </div>
                  )}

                  {activeTab === "homework" && result.data.homework && (
                    <div>
                      {result.data.homework.tasks.map((t, i) => {
                        const task = typeof t === "string" ? t : t.task;
                        const hint = typeof t === "string" ? "" : t.hint;
                        return (
                          <div key={i} style={{ marginBottom: 12, display: "flex", gap: 8 }}>
                            <span style={{ fontSize: 13.5, flexShrink: 0 }}>{i + 1}.</span>
                            <div style={{ flex: 1 }}>
                              <textarea value={task} onChange={(e) => updateHomeworkTask(i, "task", e.target.value)} rows={2} style={{ width: "100%", border: "none", background: "transparent", fontSize: 13.5, lineHeight: 1.6, color: INK, outline: "none", fontFamily: SANS, resize: "vertical" }} />
                              <input value={hint} onChange={(e) => updateHomeworkTask(i, "hint", e.target.value)} placeholder="Подсказка" style={{ width: "100%", border: "none", background: "transparent", fontSize: 12, color: MUTE, fontStyle: "italic", outline: "none", fontFamily: SANS, marginTop: 2 }} />
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {activeTab === "discussion" && result.data.discussion && (
                    <div>
                      {result.data.discussion.questions.map((q, i) => (
                        <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                          <span style={{ fontSize: 13.5, flexShrink: 0 }}>{i + 1}.</span>
                          <textarea value={q} onChange={(e) => updateDiscussionQuestion(i, e.target.value)} rows={2} style={{ flex: 1, border: "none", background: "transparent", fontSize: 13.5, lineHeight: 1.6, color: INK, outline: "none", fontFamily: SANS, resize: "vertical" }} />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function SectionHeader({ title, onRegenerate, loading }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
      <span style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.03em", color: MUTE }}>{title?.toUpperCase()}</span>
      <button onClick={onRegenerate} disabled={loading} style={{
        display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", cursor: loading ? "default" : "pointer",
        fontSize: 11.5, fontWeight: 600, color: loading ? "#C9C2B0" : INK_SOFT,
      }}>
        <Icon name="refresh" size={11} /> {loading ? "Обновляю…" : "Перегенерировать"}
      </button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<LessonGenerator />);
</script>
</body>
</html>
